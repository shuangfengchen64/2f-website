backend:
  name: git-gateway
  branch: main

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "projects"
    label: "案例 Projects"
    folder: "content/projects"
    create: true
    fields:
      - {name: "title", label: "标题 Title", widget: "string"}
      - {name: "category", label: "分类 Category", widget: "string", hint: "如 Bathroom / Kitchen / Roof"}
      - {name: "image", label: "图片 Image", widget: "image", required: false}
      - {name: "description", label: "描述 Description", widget: "text", required: false}
      - {name: "date", label: "日期 Date", widget: "date", required: false}

  - name: "settings"
    label: "网站设置 Settings"
    files:
      - name: "contact"
        label: "联系信息 Contact"
        file: "content/contact.yml"
        fields:
          - {name: "phone", label: "电话 Phone", widget: "string"}
          - {name: "email", label: "邮箱 Email", widget: "string"}
          - {name: "address", label: "地址 Address", widget: "string"}